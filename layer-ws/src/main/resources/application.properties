# name of application
spring.application.name=layer-ws

# database config
spring.datasource.url=jdbc:mysql://localhost:3306/layer-ws-db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# app port
server.port=9091

