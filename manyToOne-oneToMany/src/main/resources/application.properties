# name of application
spring.application.name=oneToOne-demo

# database config
spring.datasource.url=jdbc:mysql://localhost:3306/manyToOne-oneToMany-db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# jpa/hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# app port
server.port=9091